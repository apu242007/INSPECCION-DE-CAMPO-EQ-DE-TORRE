name: Deploy web-app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # false: un deploy en curso no se cancela. Más lento, pero no deja Pages a medio publicar.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-app/package-lock.json

      - run: npm ci

      - name: Tests
        run: npm test

      - name: Build
        env:
          # OJO con las mayúsculas: GitHub Pages es case-sensitive.
          VITE_BASE: /INSPECCION-DE-CAMPO-EQ-DE-TORRE/
          # Estos "secrets" quedan PÚBLICOS en el bundle. Se guardan así para no tenerlos en el
          # código fuente, no porque queden ocultos. Ver el modelo de seguridad en el README.
          VITE_EQT01_URL: ${{ secrets.VITE_EQT01_URL }}
          VITE_EQT02_URL: ${{ secrets.VITE_EQT02_URL }}
          VITE_EQT03_URL: ${{ secrets.VITE_EQT03_URL }}
          VITE_EQT04_URL: ${{ secrets.VITE_EQT04_URL }}
          VITE_EQT05_URL: ${{ secrets.VITE_EQT05_URL }}
          VITE_TACKER_KEY: ${{ secrets.VITE_TACKER_KEY }}
        run: npm run build

      - name: SPA fallback (404.html = index.html)
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web-app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
